<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitations - Hogwarts Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
      font-family: 'Cinzel', 'Georgia', serif; 
      background: url('p6image/9a290b29-bef6-4133-8674-8881c4dcc0b6.jpg') no-repeat center top; 
      background-size: cover; 
      background-attachment: scroll; 
      background-color: #1a0a0a; 
      min-height: 50vh; 
      overflow-x: hidden; 
      position: relative; 
    }

        .parallax-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('p6image/9a290b29-bef6-4133-8674-8881c4dcc0b6.jpg');
            background-size: cover;
            background-position: center;
            transition: transform 0.1s ease-out;
        }

        .content-wrapper {
            position: relative;
            min-height: 100vh;
            padding: 20px;
        }

        /* Crests */
        .crest {
            position: fixed;
            top: 20px;
            width: 100px;
            height: 100px;
            z-index: 1000;
            transition: transform 0.3s ease, filter 0.3s ease;
            cursor: pointer;
        }

        .crest img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }

        .hogwarts-crest {
            left: 20px;
        }

        .hogwarts-crest:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .ravenclaw-crest {
            right: 20px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 15px rgba(0, 102, 204, 0.6));
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(0, 102, 204, 0.9));
            }
        }

        /* Main Container */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding-top: 140px;
        }

        /* Banner */
        .invitations-banner {
            margin-bottom: 60px;
            animation: fadeIn 1s ease-in;
        }

        .invitations-banner img {
            max-width: 500px;
            width: 100%;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            gap: 30px;
            margin-bottom: 80px;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            animation: slideUp 1s ease-out 0.5s forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .social-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #1a1410;
            font-size: 28px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: float 3s ease-in-out infinite;
            position: relative;
        }

        .social-icon:nth-child(1) { animation-delay: 0s; }
        .social-icon:nth-child(2) { animation-delay: 0.3s; }
        .social-icon:nth-child(3) { animation-delay: 0.6s; }
        .social-icon:nth-child(4) { animation-delay: 0.9s; }
        .social-icon:nth-child(5) { animation-delay: 1.2s; }
        .social-icon:nth-child(6) { animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .social-icon:hover {
            transform: scale(1.2) translateY(-10px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.6);
            background: rgba(255, 215, 0, 0.3);
        }

        .social-icon::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: linear-gradient(45deg, transparent, rgba(255, 215, 0, 0.3));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .social-icon:hover::before {
            opacity: 1;
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            100% {
                transform: rotate(360deg);
            }
        }

        /* Inquiry Form */
        .inquiry-form {
            background: rgba(245, 235, 210, 0.95);
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            border: 3px solid #8b7355;
            opacity: 0;
            animation: slideUp 1s ease-out 1s forwards;
            position: relative;
        }

        .inquiry-form::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background-image: url('p6image/d0df704e-3e4e-4a4e-87d6-eaee8339be30.png');
            background-size: contain;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.5));
        }

        .inquiry-form h2 {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
            color: #2c2416;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c2416;
            font-size: 16px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #8b7355;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            font-family: 'Georgia', serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            background: #fff;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #8b4513 0%, #a0522d 100%);
            border: none;
            border-radius: 50px;
            color: #f5ebd2;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '✨';
            position: absolute;
            left: -100%;
            top: 50%;
            transform: translateY(-50%);
            transition: left 0.5s ease;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.6);
            background: linear-gradient(135deg, #a0522d 0%, #8b4513 100%);
        }

        .submit-btn:hover::before {
            left: 20px;
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        /* Sparkles Effect */
        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkleAnimation 1.5s ease-out forwards;
            z-index: 9999;
        }

        @keyframes sparkleAnimation {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            100% {
                opacity: 0;
                transform: scale(0) translateY(-100px);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .crest {
                width: 70px;
                height: 70px;
                top: 10px;
            }

            .hogwarts-crest {
                left: 10px;
            }

            .ravenclaw-crest {
                right: 10px;
            }

            .invitations-banner img {
                max-width: 300px;
            }

            .social-icons {
                gap: 20px;
                margin-bottom: 60px;
            }

            .social-icon {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            .inquiry-form {
                padding: 30px 20px;
            }

            .inquiry-form h2 {
                font-size: 24px;
            }

            .main-container {
                padding-top: 100px;
            }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="background-container">
        <div class="parallax-layer"></div>
    </div>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <!-- Crests -->
        <a href="page2.html" class="crest hogwarts" title="Back to Home">
                <img src="p5image/bb5e386e-7887-433b-8f1c-c5b02507ffcb-removebg-preview.png" alt="Hogwarts Crest">
            </a>
        <div class="crest ravenclaw-crest">
            <img src="p6image/1d6bb08c-3670-4e63-bdc2-28e08b5fffe3-removebg-preview.png" alt="Ravenclaw Crest">
        </div>

        <!-- Main Container -->
        <div class="main-container">
            <!-- Invitations Banner -->
            <div class="invitations-banner">
                <img src="p6image/24df36f0-be58-4a7a-899b-c198cc96aeb1-removebg-preview.png" alt="Invitations Banner">
            </div>

            <!-- Social Media Icons -->
            <div class="social-icons">
                <a href="https://github.com/dolkly" target="_blank" class="social-icon" title="GitHub">

                </a>
                <a href="https://ph.linkedin.com/in/kenneth-jane-7271b030a" target="_blank" class="social-icon" title="LinkedIn">
                    <img src="p6image/d0443c1a-39d5-4626-824d-db6c93e8aaeb-removebg-preview.png" alt="LinkedIn Logo" style="width: 60%; height: 60%;">

                <a href="https://www.facebook.com/share/1BGbM9xUqQ/" target="_blank" class="social-icon" title="Facebook">

            <!-- Inquiry Form -->
            <form class="inquiry-form" id="inquiryForm">
                <h2>Send an Owl</h2>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Your full name">
                </div>
                <div class="form-group">
                    <label for="email">Gmail Address</label>
                    <input type="email" id="email" name="email" required placeholder="your.email@gmail.com">
                </div>
                <div class="form-group">
                    <label for="contact">Contact Number</label>
                    <input type="tel" id="contact" name="contact" required placeholder="+1 234 567 8900">
                </div>
                <div class="form-group">
                    <label for="message">Message or Inquiry</label>
                    <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>

    <script>
        // Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const parallax = document.querySelector('.parallax-layer');
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            parallax.style.transform = `translate(${x}px, ${y}px)`;
        });

        // Sparkle Effect on Mouse Move
        let sparkleTimeout;
        document.addEventListener('mousemove', (e) => {
            clearTimeout(sparkleTimeout);
            sparkleTimeout = setTimeout(() => {
                if (Math.random() > 0.8) {
                    createSparkle(e.clientX, e.clientY);
                }
            }, 50);
        });

        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            document.body.appendChild(sparkle);
            
            setTimeout(() => {
                sparkle.remove();
            }, 1500);
        }

        // Form Submission Handler
        document.getElementById('inquiryForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                contact: document.getElementById('contact').value,
                message: document.getElementById('message').value
            };

            // Create mailto link (replace YOUR_EMAIL with your actual email)
            const mailtoLink = `mailto:kennethjane670@gmail.com?subject=Portfolio Inquiry from ${encodeURIComponent(formData.name)}&body=Name: ${encodeURIComponent(formData.name)}%0D%0AEmail: ${encodeURIComponent(formData.email)}%0D%0AContact: ${encodeURIComponent(formData.contact)}%0D%0A%0D%0AMessage:%0D%0A${encodeURIComponent(formData.message)}`;
            
            window.location.href = mailtoLink;

            // Create magical effect
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    createSparkle(
                        Math.random() * window.innerWidth,
                        Math.random() * window.innerHeight
                    );
                }, i * 50);
            }

            // Show success message
            alert('Your owl is on its way! 🦉✨');
            
            // Reset form
            e.target.reset();
        });

        // Scroll Reveal Animation
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.social-icons, .inquiry-form').forEach(el => {
            observer.observe(el);
        });

        // Add magical sparkles on icon hover
        document.querySelectorAll('.social-icon').forEach(icon => {
            icon.addEventListener('mouseenter', (e) => {
                const rect = e.target.getBoundingClientRect();
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        createSparkle(
                            rect.left + rect.width / 2 + (Math.random() - 0.5) * 50,
                            rect.top + rect.height / 2 + (Math.random() - 0.5) * 50
                        );
                    }, i * 100);
                }
            });
        });
    </script>
</body>
